name: Release

# Push a tag like v0.2.0 to publish a signed release. Installed copies of
# GameMode find it through latest.json and update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GameMode ${{ github.ref_name }}
          releaseBody: Installa GameMode_*_x64-setup.exe, oppure aggiorna da GameMode → Impostazioni → Aggiornamenti.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
