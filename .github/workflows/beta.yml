name: Beta

# Every push to main or to a beta branch publishes "GameMode Beta": a
# separate app (own name, data and shortcuts) that installs next to the
# stable one and updates itself from the "beta" release. Main is included so
# installed betas keep updating after a feature branch is merged, without a
# reinstall.
on:
  push:
    branches: ["main", "beta/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Beta versions sit one minor above stable and grow with every build,
      # so installed betas always see the newest one as an update.
      - name: Beta version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const [major, minor] = require("./package.json").version.split(".").map(Number);
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.beta.conf.json", "utf8"));
            conf.version = `${major}.${minor + 1}.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync("src-tauri/tauri.beta.generated.json", JSON.stringify(conf, null, 2));
            console.log("Beta version", conf.version);
          '

      # tauri-action reads only the first 50 assets of the release when it
      # writes latest.json: past that it misses the new installer and leaves
      # latest.json on the old version, so installed betas stop updating.
      # Every build adds an installer and its signature: keep the last few.
      - name: Prune old beta builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/beta" --jq .id 2>/dev/null) || exit 0
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release}/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' > assets.txt
          version() { sed -nE 's/^GameMode\.Beta_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/p' <<<"$1"; }
          keep=$(while read -r _ name; do version "$name"; done < assets.txt | sort -uV | tail -n 5)
          echo "Keeping: $(echo $keep)"
          while read -r id name; do
            v=$(version "$name")
            if [ -n "$v" ] && ! grep -qxF "$v" <<<"$keep"; then
              echo "Deleting $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            fi
          done < assets.txt

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta
          releaseName: GameMode Beta
          releaseBody: Versione di prova dal branch ${{ github.ref_name }}. Si installa accanto a GameMode e si aggiorna da sola a ogni nuova build.
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.beta.generated.json
