[package]
name = "gamemode"
version = "0.2.6"
description = "Launcher console per i giochi su Windows"
authors = ["Massimiliano Polce"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamemode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.104"
sysinfo = "0.39.6"
roxmltree = "0.21.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.54.0", features = ["sync", "time", "macros"] }
base64 = "0.23.1"
serde_yaml = "0.9.34"
glob = "0.3.4"
dirs = "7.0.0"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_Packaging_Appx", "Devices_Radios", "Devices_WiFi", "Devices_Bluetooth", "Devices_Enumeration", "Security_Credentials", "Networking_Connectivity", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "System", "System_Power", "Media_Control", "Storage_Streams", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_System_Shutdown", "Win32_Security", "Win32_UI_Shell"] }
winreg = "0.56.0"
# The tray icon exists only when GameMode sits behind the Windows desktop.
tauri = { version = "2", features = ["tray-icon"] }
# Direct dependency so `#[implement]` (COM callbacks in audio_events.rs) resolves `::windows_core`.
windows-core = "0.62.2"
